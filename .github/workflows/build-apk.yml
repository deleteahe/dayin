name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: List build output
        run: ls -lh app/build/outputs/apk/debug/

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dayin-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          gh release create "build-${GITHUB_RUN_NUMBER}" "$APK" \
            --title "Dayin Demo build ${GITHUB_RUN_NUMBER}" \
            --notes "Automated debug build from commit ${GITHUB_SHA:0:7}." \
            --target "$GITHUB_SHA"
